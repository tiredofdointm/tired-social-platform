steps:
  - name: 'node:22-alpine'
    entrypoint: npm
    args: ['ci', '--no-audit', '--no-fund']
  - name: 'node:22-alpine'
    entrypoint: npm
    args: ['run', 'check']
  - name: 'node:22-alpine'
    entrypoint: npm
    args: ['test']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/$PROJECT_ID/tired-social/app:latest'
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
