name: Verify platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build Cloud Run container
        run: docker build -t tired-social:test .
      - name: Verify container runtime health
        run: |
          docker run -d --name tired-health -e K_REVISION=ci-runtime -p 8080:8080 tired-social:test
          trap 'docker logs tired-health; docker rm -f tired-health' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8080/healthz --output /tmp/tired-health.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const h=JSON.parse(fs.readFileSync('/tmp/tired-health.json')); assert.equal(h.status,'ok'); assert.equal(h.revision,'ci-runtime');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: artifacts/
          if-no-files-found: ignore
