name: Verify database
on:
  push:
    paths:
      - 'db/**'
      - 'server/**'
      - 'server.mjs'
      - 'src/**'
      - 'public/**'
      - 'scripts/build.mjs'
      - 'test/database/**'
      - 'package*.json'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'server/**'
      - 'server.mjs'
      - 'src/**'
      - 'public/**'
      - 'scripts/build.mjs'
      - 'test/database/**'
      - 'package*.json'
      - '.github/workflows/database.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: platform_test
      PGPASSWORD: ephemeral_ci_only
      PGDATABASE: platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test migration runner and data access
        run: npm run test:database
        env:
          TEST_BROWSER: '1'
          TEST_DATABASE_URL: postgres://platform_test:ephemeral_ci_only@localhost:5432/platform_test
      - name: Verify migration replay
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://platform_test:ephemeral_ci_only@localhost:5432/platform_test
      - name: Test data and visibility constraints
        run: psql -v ON_ERROR_STOP=1 -f db/tests/identity_social.sql
      - name: Restore a logical backup into a separate database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          archive=$(mktemp -d)
          trap 'rm -rf "$archive"' EXIT
          docker exec "$POSTGRES_CONTAINER" pg_dump -U platform_test -d platform_test -Fc -O -x >"$archive/platform.dump"
          docker exec "$POSTGRES_CONTAINER" createdb -U platform_test -T template0 platform_recovery
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U platform_test -d platform_recovery -O -x --single-transaction <"$archive/platform.dump"
          psql -X -v ON_ERROR_STOP=1 -At -d platform_test -f db/tests/backup_fingerprints.sql >"$archive/source.txt"
          psql -X -v ON_ERROR_STOP=1 -At -d platform_recovery -f db/tests/backup_fingerprints.sql >"$archive/restored.txt"
          test -s "$archive/source.txt"
          diff -u "$archive/source.txt" "$archive/restored.txt"
          psql -X -v ON_ERROR_STOP=1 -d platform_recovery -f db/tests/identity_social.sql
          DATABASE_URL=postgres://platform_test:ephemeral_ci_only@localhost:5432/platform_recovery npm run db:migrate
          echo 'Restored PostgreSQL schema, application rows, and migration ledger.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-community-screenshots
          path: artifacts/
          if-no-files-found: ignore
